plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

// DevxyzMuse fixed signing: every build (local + CI) is signed with the
// SAME permanent key, so updates install in place and clone data/accounts
// survive updates. The keystore is stored base64-encoded at
// signing/devxyzmuse-keystore.b64 (a dedicated key for this app only)
// and decoded here at configuration time.
def devxyzMuseKeystore = new File(projectDir, "build/fixed-signing/devxyzmuse.p12")
if (!devxyzMuseKeystore.exists()) {
    devxyzMuseKeystore.parentFile.mkdirs()
    def b64 = rootProject.file("signing/devxyzmuse-keystore.b64").getText("UTF-8").replaceAll(/\s/, "")
    devxyzMuseKeystore.bytes = java.util.Base64.getDecoder().decode(b64)
}

android {

    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"
    defaultConfig {
        applicationId "com.jepongdevxyz.devxyzmuse"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        splits {
            abi {
                enable true
                reset()
                
                include 'armeabi-v7a', "arm64-v8a"
                universalApk true
            }
        }
    }

    signingConfigs {
        fixed {
            storeFile devxyzMuseKeystore
            storePassword "devxyzmuse"
            keyAlias "devxyzmuse"
            keyPassword "devxyzmuse"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packaging {
        jniLibs {
            excludes.add("**/libandroidx.graphics.path.so")
        }
        resources {
            excludes.add("**/libandroidx.graphics.path.so")
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "DevxyzMuse_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

