name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzClone-engine-debug
          path: app/build/outputs/apk/debug/*.apk
